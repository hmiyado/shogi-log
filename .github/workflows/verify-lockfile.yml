# .github/workflows/actions.lock が workflow と一致しているか、
# ロックした commit が upstream で検証できるかを確認する。
# https://github.com/github/gh-actions-lock/blob/main/.github/workflows/verify-lockfile.yml

name: verify-lockfile

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false

      - name: Install gh-actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.4.0

      - name: Verify actions.lock
        run: gh actions-lock --verify
